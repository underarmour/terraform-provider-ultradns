# Fork-only: publishes the PR #64 (webforward) provider build as a GitHub
# prerelease until upstream releases it. Lives only on fork/release.
name: Fork Release
on:
  push:
    tags:
      - 'v*-webforward.*'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'underarmour/terraform-provider-ultradns'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetching GO version from repo
        run: echo "GO_VERSION=$(cat .go-version)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit tests
        run: go test ./...
        env:
          GOWORK: 'off'
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser.fork.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
